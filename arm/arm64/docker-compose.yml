version: '3.8'

services:
  acestream:
    platform: linux/arm64
    image: visesa84/acestream-scraper-outpace:latest
    container_name: Acestream_Proxy
    network_mode: bridge
    privileged: true
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Europe/Madrid
      - ENABLE_TOR=false
      - WG_QUICK_USERSPACE_IMPLEMENTATION=boringtun
      - WG_THREADS=4
      - ENABLE_WARP=false
      - ENABLE_ACESTREAM_SEARCH=true
      - CONTAINER_NETWORK_MODE=bridge
      - WARP_LICENSE_KEY=
      - FLASK_PORT=8040
    ports:
      - "1935:1935"  # Outpace RTMP Port
      - "6878:6878"  # Outpace Port
      - "8040:8040"  # Flask application
      - "8621:8621"  # Outpace P2P Port
      - "8622:8622"  # Outpace P2P Port
      - "8625:8625"  # Acestream Search P2P Port
      - "43110:43110"  # ZeroNet UI
      - "43111:43111"  # ZeroNet peer
      - "26552:26552"  # ZeroNet peer
    volumes:
      - ./Docker:/app/ZeroNet/data
      - ./Docker:/app/config
      - ./Docker/recordings:/app/config/recordings
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
