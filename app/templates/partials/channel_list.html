<div class="table-responsive">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
            <tr>
                <th class="border-0 rounded-start ps-4" style="width: 30%">Channel Name</th>
                <th class="border-0" style="width: 25%">Stream ID / Hash</th>
                <th class="border-0" style="width: 15%">Status / Info</th>
                <th class="border-0" style="width: 15%">Last Checked</th>
                <th class="border-0 text-end rounded-end pe-4" style="width: 15%">Actions</th>
            </tr>
        </thead>
        <tbody id="channelListContent">
            <!-- Channel list will be populated by JavaScript -->
            <tr>
                <td colspan="5" class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                    Loading channels list...
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Channel Edit Modal (Con todos los campos requeridos por channels.js) -->
<div class="modal fade" id="editChannelModal" tabindex="-1" aria-labelledby="editChannelModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="modal-header border-0 pb-0 px-4 pt-4">
                <h5 class="modal-title fw-bold text-primary" id="editChannelModalLabel">Edit Channel</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="editChannelForm" class="row g-3">
                    <input type="hidden" id="editChannelId">
                    
                    <div class="form-check form-switch mb-3 p-3 bg-body-tertiary rounded-3">
                        <input class="form-check-input ms-0 me-2" type="checkbox" id="editChannelStatus" role="switch">
                        <label class="form-check-label fw-semibold" for="editChannelStatus">
                            Channel Status: <span id="statusLabelText" class="fw-bold text-success">Active</span>
                        </label>
                    </div>

                    <div class="col-md-6">
                        <label for="editChannelName" class="form-label small fw-bold text-uppercase text-muted">Channel Name</label>
                        <input type="text" class="form-control bg-body-tertiary border-0 rounded-3" id="editChannelName" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="editChannelGroup" class="form-label small fw-bold text-uppercase text-muted">Group</label>
                        <input type="text" class="form-control bg-body-tertiary border-0 rounded-3" id="editChannelGroup">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="editChannelLogo" class="form-label small fw-bold text-uppercase text-muted">Logo URL</label>
                        <input type="url" class="form-control bg-body-tertiary border-0 rounded-3" id="editChannelLogo">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="editChannelTvgId" class="form-label small fw-bold text-uppercase text-muted">TVG ID</label>
                        <input type="text" class="form-control bg-body-tertiary border-0 rounded-3" id="editChannelTvgId">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="editChannelTvgName" class="form-label small fw-bold text-uppercase text-muted">TVG Name</label>
                        <input type="text" class="form-control bg-body-tertiary border-0 rounded-3" id="editChannelTvgName">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="editChannelOriginalUrl" class="form-label small fw-bold text-uppercase text-muted">Original URL</label>
                        <input type="url" class="form-control bg-body-tertiary border-0 rounded-3" id="editChannelOriginalUrl">
                    </div>
                    
                    <div class="col-md-12">
                        <label for="editChannelM3uSource" class="form-label small fw-bold text-uppercase text-muted">M3U Source</label>
                        <input type="text" class="form-control bg-body-tertiary border-0 rounded-3" id="editChannelM3uSource">
                    </div>

                    <div class="col-12 mt-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="editChannelEpgLocked">
                            <label class="form-check-label fw-semibold" for="editChannelEpgLocked">
                                Lock mapping from EPG source
                            </label>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top-0 px-4 pb-4">
                <button type="button" class="btn btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary rounded-pill px-4 shadow-sm" id="saveEditChannelBtn">Save Changes</button>
            </div>
        </div>
    </div>
</div>

<style>
    .channel-logo {
        object-fit: contain;
        background-color: #f8f9fa;
        padding: 2px;
        border-radius: 6px;
    }
    
    /* Estilos para forzar una correcta maquetación de la tabla generada por JS */
    #channelListContent tr {
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }
    #channelListContent td {
        vertical-align: middle !important;
        padding-top: 1rem !important;
        padding-bottom: 1rem !important;
    }
</style>
